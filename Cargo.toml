[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"

[features]
default = ["server"]
server = [
    "dep:argon2",
    "dep:axum",
    "dep:jsonwebtoken",
    "dep:rand_core",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:uuid",
]

[dependencies]
axum = { version = "0.8", features = ["json"], optional = true }
argon2 = { version = "0.5", optional = true }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[lib]
name = "sentinel_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sentinel-server"
path = "src/main.rs"
required-features = ["server"]
